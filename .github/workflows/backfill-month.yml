name: Monthly Archive Backfill

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year (YYYY)"
        required: true
        default: "2026"
      month:
        description: "Month (MM)"
        required: true
        default: "10"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Monthly Backfill Script
        run: node scripts/backfill-month.js ${{ github.event.inputs.year }} ${{ github.event.inputs.month }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          git commit -m "📅 Backfilled monthly results for ${{ github.event.inputs.year }}-${${ github.event.inputs.month }}"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
